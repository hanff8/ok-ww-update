name: "ok-ww"
uac: true
icon: "icons/icon.png"
website: "http://ok-script.com/ok-ww"

profiles:
  - name: "China"
    # 指向本 fork 自己的更新仓库（由 build.yml 的 synchronize 作业用 partial-sync-repo 同步），
    # 不能再指上游 ok-ww-update2，否则装完启动器会 clone 上游代码，版本永远停在上游。
    git_url: "https://github.com/hanff8/ok-ww-update.git"
    admin: true
    main_script: "main.py"
    requires_python: "3.12"
    requirements: "requirements.txt"
    use_pythonw: true
    pip_args: "--no-deps"
    show_add_defender: true
    # PYTHONPATH: "your/default/path" # Optional, will be "" if missing

  - name: "Global"
    git_url: "https://github.com/hanff8/ok-ww-update.git"
    main_script: "main.py"
    requirements: "requirements.txt"


